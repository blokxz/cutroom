<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" font-family="Inter, Segoe UI, system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">cutroom · reel-families — spec-driven reel orchestration</title>
<desc id="d">Three phases: pre-construction (repo analysis, onetake criteria benchmark, rules, spec.md), core SDD construction (router, guidelines, references, variation engine, summary tool, compression), post-deployment and CI/CD (integrate, run, git, lint/test/bench/fuzz) with a feedback loop to spec.md.</desc>
<style>
.node{transition:filter .15s ease,stroke-width .15s ease}.node:hover{filter:brightness(1.35)}
.h{font-size:15px;font-weight:700;fill:#e6edf3}.t{font-size:12.5px;fill:#c9d1d9}.m{font-size:12px;fill:#8b949e}
.c{font-family:JetBrains Mono,SFMono-Regular,Consolas,monospace;font-size:11.5px;fill:#c9d1d9}
.ph{font-size:13px;font-weight:800;letter-spacing:1.5px}
.flow{stroke-dasharray:7 6;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs>
