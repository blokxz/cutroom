name: ci

on:
  push:
  pull_request:

jobs:
  verifier:
    name: verifier tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest tools/tests -q

  remotion:
    name: types, unit tests and a real render
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-base/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r tools/requirements.txt
      - name: install
        working-directory: remotion-base
        run: npm ci
      - name: types
        working-directory: remotion-base
        run: npx tsc --noEmit
      - name: unit tests
        working-directory: remotion-base
        run: npm test
      - name: plugin manifest
        run: python tools/check_plugin.py
      - name: render every example from its brief and verify (fails on any FAIL)
        working-directory: remotion-base
        run: |
          for b in ../clients/sample/briefs/*.json; do
            node scripts/render.mjs --brief "$b" --force
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: |
            remotion-base/out/**/*.mp4
            remotion-base/out/**/*-sheet.png
          retention-days: 7

  windows:
    name: Windows (tests, types, a test frame)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-base/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: setup (dependencies + .env)
        run: python tools/setup.py
      - name: verifier and pipeline tests
        run: python -m pytest tools/tests -q
      - name: types and unit tests
        working-directory: remotion-base
        run: |
          npx tsc --noEmit
          npm test
      - name: doctor (renders one frame with Remotion's own browser)
        run: python tools/doctor.py
