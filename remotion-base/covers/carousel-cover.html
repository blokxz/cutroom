<!doctype html>
<!-- Carousel cover, 1080x1350 (4:5): brand logo, a photo in an arch window, a title and a progress bar.
     Pure HTML + SVG. Parameters come from the query string:
       ?photo=carousel/4.jpg&logo=carousel/logo.png&title=...&subtitle=...&total=6&focus=50,50
     Paths are relative to remotion-base/public. Render with: node scripts/html-still.mjs covers/carousel-cover.html out.jpg -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("../../clients/sample/assets/fonts/DMSerifDisplay-400.woff2"); }
  @font-face { font-family: "Display"; font-style: italic; src: url("../../clients/sample/assets/fonts/DMSerifDisplay-400i.woff2"); }
  @font-face { font-family: "Text"; font-weight: 500; src: url("../../clients/sample/assets/fonts/Inter-600.woff2"); }
  :root { --cream: #F5EFE6; --green: #3F4A41; --rose: #C9A3AA; --wine: #8B4752; }
  html, body { margin: 0; width: 1080px; height: 1350px; background: var(--cream); overflow: hidden; }
  .cover { position: relative; width: 1080px; height: 1350px; }
  svg { position: absolute; inset: 0; }
  .logo { position: absolute; top: 62px; left: 375px; width: 330px; }
  .title { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; color: var(--green);
           font: 400 84px/1 "Display", serif; }
  .title i { color: var(--wine); }
  .sub { position: absolute; left: 0; right: 0; top: 1196px; text-align: center; color: var(--green); opacity: .8;
         font: 500 27px "Text", sans-serif; letter-spacing: .32em; text-transform: uppercase; }
  .bar { position: absolute; left: 84px; right: 84px; top: 1286px; display: flex; gap: 10px; }
  .bar b { flex: 1; height: 6px; border-radius: 3px; background: rgba(63,74,65,.25); }
  .bar b:first-child { background: var(--green); }
</style>
</head>
<body>
<div class="cover" id="cover">
  <svg viewBox="0 0 1080 1350" width="1080" height="1350" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- arch window: 580 wide, 650 tall, semicircular top -->
      <clipPath id="arch"><path d="M250,1030 V670 A290,290 0 0 1 830,670 V1030 Z"/></clipPath>
      <!-- a sprig like the one in the logo: a stem and five leaves -->
      <g id="sprig">
        <path d="M0,0 C20,-60 30,-120 60,-190" fill="none" stroke="#C9A3AA" stroke-width="3" stroke-linecap="round"/>
        <g fill="#E6CFD3" stroke="#C9A3AA" stroke-width="2.5">
          <ellipse cx="14" cy="-48" rx="13" ry="34" transform="rotate(-48 14 -48)"/>
          <ellipse cx="44" cy="-70" rx="13" ry="34" transform="rotate(42 44 -70)"/>
          <ellipse cx="22" cy="-112" rx="13" ry="34" transform="rotate(-42 22 -112)"/>
          <ellipse cx="56" cy="-134" rx="13" ry="34" transform="rotate(36 56 -134)"/>
          <ellipse cx="62" cy="-176" rx="12" ry="32" transform="rotate(8 62 -176)"/>
        </g>
      </g>
    </defs>
    <!-- sprigs growing out beside the arch -->
    <use href="#sprig" transform="translate(176 1010) rotate(-8)"/>
    <use href="#sprig" transform="translate(904 1010) scale(-1 1) rotate(-8)"/>
    <!-- double outline of the arch -->
    <path d="M232,1048 V670 A308,308 0 0 1 848,670 V1048 Z" fill="none" stroke="#3F4A41" stroke-width="2.5"/>
    <image id="photo" href="" x="250" y="380" width="580" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#arch)"/>
    <path d="M250,1030 V670 A290,290 0 0 1 830,670 V1030 Z" fill="none" stroke="#3F4A41" stroke-width="2"/>
  </svg>
  <img class="logo" id="logo" alt="">
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <div class="bar" id="bar"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const pub = "../public/";
  const photo = document.getElementById("photo");
  photo.setAttribute("href", pub + (q.get("photo") || "carousel/4.jpg"));
  const [fx, fy] = (q.get("focus") || "50,50").split(",").map(Number);
  photo.setAttribute("preserveAspectRatio", fx === 50 && fy === 50 ? "xMidYMid slice" : `xMidYMid slice`);
  document.getElementById("logo").src = pub + (q.get("logo") || "carousel/logo.png");
  // the last word of the title is the accent
  const words = (q.get("title") || "Conocé los bungalows").split(" ");
  const last = words.pop();
  document.getElementById("title").innerHTML = `${words.join(" ")} <i>${last}</i>`;
  document.getElementById("sub").textContent = (q.get("subtitle") || "5 ambientes · deslizá") + " →";
  const total = +(q.get("total") || 6);
  document.getElementById("bar").innerHTML = "<b></b>".repeat(total);
  Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))])
    .then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
